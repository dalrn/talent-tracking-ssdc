# Streamlit theme. This is the first-order fix for the "vanilla" look:
# it repaints every native widget accent (tabs, radio, slider, checkbox,
# primary button) to the CDC navy, and sets the canvas white to match the
# navy-and-white brand. Fine typography, flat cards, and chrome cleanup live
# in components/styles.py.
#
# Colors here MUST stay in sync with WARNA in config.py:
#   primaryColor           = WARNA["navy"]
#   backgroundColor        = white canvas
#   secondaryBackgroundColor = a faint cool tint for the sidebar
#   textColor              = WARNA["ink"]

[theme]
base = "light"
primaryColor = "#16324f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f8fa"
textColor = "#14181a"
# Font family is driven from styles.py (Inter, injected via CSS) so the look
# is identical across Streamlit versions. "sans serif" is just the fallback.
font = "sans serif"

[client]
# Hide the "Deploy" button and collapse the developer chrome for a
# product-grade presentation.
toolbarMode = "minimal"
showErrorDetails = "full"
